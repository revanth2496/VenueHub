{% extends 'base.html' %}{% block title %}Edit hall{% endblock %}{% block content %}<section class="page-heading"><h1>Edit hall</h1></section><form class="form-card narrow" method="post"><label>Hall name<input name="name" required value="{{ hall.name }}"></label><label>Capacity<input type="number" name="capacity" min="1" required value="{{ hall.capacity }}"></label><label>Hourly rate<input type="number" name="hourly_rate" min="0" step="0.01" required value="{{ hall.hourly_rate }}"></label><label>Description<textarea name="description" rows="3">{{ hall.description }}</textarea></label><div class="form-actions"><a class="btn secondary" href="{{ url_for('admin_halls') }}">Cancel</a><button class="btn primary">Save changes</button></div></form>{% endblock %}
